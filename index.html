  <!-- the page for whoever reads without JavaScript (search engines, AI assistants), written by tools/seo.mjs --><!-- seo:noscript --><noscript><div class="seo-noscript">
      <h1>SavComponents</h1>
      <p>SavComponents (www.savcomponents.com) is a free, open-source (MIT) library of 82 web components for websites and web apps, by Saverio Morelli: buttons, fields, pickers, dialogs, tabs, tables, charts and more, written as plain HTML tags (&lt;sav-button&gt;, &lt;sav-input&gt;, &lt;sav-dialog&gt;…). No framework and no build step: one stylesheet and one script. Themes with CSS custom properties, light and dark modes and five styles (Soft, Tilt, Sharp, Brutal, Glass). Accessible (keyboard, screen readers), English and Italian built in.</p>
      <pre><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;https://www.savcomponents.com/v/1.2.0/sav.css&quot;&gt;
&lt;script src=&quot;https://www.savcomponents.com/v/1.2.0/sav.js&quot; defer&gt;&lt;/script&gt;

&lt;sav-button&gt;Hello&lt;/sav-button&gt;</code></pre>
      <h2>Actions</h2>
      <ul><li><a href="#button">Button</a> <code>&lt;sav-button&gt;</code>: Buttons start an action or navigate. Five semantic colours, five appearances, three sizes; a button with href renders a link.</li><li><a href="#button-group">Button group</a> <code>&lt;sav-button-group&gt;</code>: Joins buttons together. Works with any appearance and with dropdowns.</li><li><a href="#copy-button">Copy button</a> <code>&lt;sav-copy-button&gt;</code>: Copies text to the clipboard and confirms with a check mark.</li><li><a href="#favourite-button">Favourite button</a> <code>&lt;sav-favourite-button&gt;</code>: A toggle for favourites, likes and bookmarks: a star, a heart or a bookmark that fills with its colour when pressed.</li></ul>
      <h2>Feedback</h2>
      <ul><li><a href="#alert">Alert</a> <code>&lt;sav-alert&gt;</code>: Shows an important message inline. The icon follows the variant.</li><li><a href="#toast">Toast</a> <code>Sav.toast()</code>: Short notifications that stack in a corner and close themselves. Hovering pauses the timer.</li><li><a href="#badge">Badge</a> <code>&lt;sav-badge&gt;</code>: Small labels for counts and statuses.</li><li><a href="#new-label">New label</a> <code>&lt;sav-new-label&gt;</code>: Marks something as new: a badge (with sparkles and a passing shine if you like), a diagonal ribbon or a tab in the corner of a card, a pulsing dot, or just the coloured word. It can take care of itself: until hides it after a date, seen-key hides it for good once the person has clicked what it marks.</li><li><a href="#tag">Tag</a> <code>&lt;sav-tag&gt;</code>: Keywords, filters and choices; removable tags fire an event and remove themselves.</li><li><a href="#spinner">Spinner</a> <code>&lt;sav-spinner&gt;</code>: An indeterminate loading indicator. It takes the font size of its parent. Its look follows the style: a ring (square in Sharp, rounded square in Brutal) or, in Tilt, the four leaning tiles of the logo lighting up in turn.</li><li><a href="#progress">Progress</a> <code>&lt;sav-progress-bar · sav-progress-ring&gt;</code>: Show how far a task has gone.</li><li><a href="#skeleton">Skeleton</a> <code>&lt;sav-skeleton&gt;</code>: Placeholders that hold the layout while content loads.</li><li><a href="#empty-state">Empty state</a> <code>&lt;sav-empty-state&gt;</code>: What to show when there is nothing yet — no results, an empty inbox, a new project: a drawing made of the icon on leaning tiles (they lean the way the style does), a heading, a line of text and what to do next.</li></ul>
      <h2>Forms</h2>
      <ul><li><a href="#input">Input</a> <code>&lt;sav-input&gt;</code>: A text field with label, help text, icons, clear button and password toggle. It takes part in native forms and validation.</li><li><a href="#number-input">Number input</a> <code>&lt;sav-number-input&gt;</code>: A number field with a − button on the left and a + on the right. The buttons switch off at the minimum and maximum; hold one to keep counting. After a wrong entry it says why (too small, too large, which steps fit); with limits=&quot;always&quot; it also shows the allowed range beforehand. It takes part in native forms and validation.</li><li><a href="#zoom">Zoom</a> <code>&lt;sav-zoom&gt;</code>: A zoom control: “−”, the percentage, “+”. A click on the percentage goes back to 100%. With for it zooms an element of the page by itself; otherwise listen to change.</li><li><a href="#color-picker">Colour picker</a> <code>&lt;sav-color-picker&gt;</code>: A colour field: a swatch, the hex code you can type, and suggested colours. The swatch opens the library’s own colour panel, in the style and theme of the page (saturation and brightness, hue, opacity with alpha, the code, an eyedropper); where the browser cannot offer all of it (Safari, Firefox) the system colour picker opens instead; picker=&quot;custom&quot; always uses the panel, picker=&quot;native&quot; always the system picker. The value is &quot;#rrggbb&quot; (&quot;#rrggbbaa&quot; with alpha); with clearable it can be empty. compact keeps only the swatch.</li><li><a href="#textarea">Textarea</a> <code>&lt;sav-textarea&gt;</code>: Multi-line text, with an optional counter and automatic height.</li><li><a href="#select">Select</a> <code>&lt;sav-select&gt;</code>: A select with its own list: search, multiple choice, groups and descriptions. Put normal &lt;option&gt; and &lt;optgroup&gt; elements inside. On phones it can open as a sheet from the bottom, or use the phone’s own picker.</li><li><a href="#date-picker">Date picker</a> <code>&lt;sav-date-picker&gt;</code>: Picks a day, a month or a year from a calendar in the language of the page. The value is always ISO (2026-11-16), whatever is shown. Keyboard: arrows, Page Up / Down, Enter.</li><li><a href="#time-picker">Time picker</a> <code>&lt;sav-time-picker&gt;</code>: Picks a time from hour and minute columns, in 24 or 12 hours following the language. The value is always 24-hour (18:30).</li><li><a href="#checkbox">Checkbox &amp; Switch</a> <code>&lt;sav-checkbox · sav-switch&gt;</code>: On/off choices. Checkboxes also support the indeterminate state.</li><li><a href="#radio">Radio group</a> <code>&lt;sav-radio-group · sav-radio&gt;</code>: One choice among several, with arrow-key navigation. appearance=&quot;buttons&quot; turns it into a segmented control; appearance=&quot;cards&quot; into a grid of cards, each with a picture of its own (looks, layouts, templates, plans).</li><li><a href="#chip">Chip</a> <code>&lt;sav-chip · sav-chip-group&gt;</code>: A small choice you can switch on and off — filters, options, interests. In a sav-chip-group the chips become a single or multiple choice. (A tag only labels; a chip is chosen.)</li><li><a href="#otp">OTP input</a> <code>&lt;sav-otp&gt;</code>: A one-time code in separate boxes. Choose how many characters and which: numbers only, letters only, letters and numbers, or anything. Pasting a whole code fills every box; phones offer the code from an SMS.</li><li><a href="#password">Password</a> <code>&lt;sav-password&gt;</code>: A password field with a strength meter and a checklist of rules you set: minimum length, upper-case and lower-case letters, numbers, symbols. It can refuse to submit a password that is too weak.</li><li><a href="#search">Search</a> <code>&lt;sav-search&gt;</code>: A search field that suggests as you type: highlighted matches, arrows and Enter to choose. Suggestions come from children, or from the page on every &quot;sav-query&quot; (for a server search). With multiple every term becomes a chip inside the field (on comma, semicolon, Enter or Space, as you set); with live it searches while you type instead of only on Enter.</li><li><a href="#chip-input">Chip input</a> <code>&lt;sav-chip-input&gt;</code>: A field whose values are chips: type one and press Enter, a comma or a semicolon, or paste a list; × or Backspace removes them. With kind=&quot;color&quot; each chip is a colour with its swatch; with kind=&quot;number&quot; only numbers go in. The value is the list.</li><li><a href="#language-choice">Language choice</a> <code>&lt;sav-language-choice&gt;</code>: Choose a language from a complete list (about 140, already there): flag on the left, ISO 639-3 code on the right, search, one or many. Variants have their own flag (British and American English); several languages can share one (India, Spain, Switzerland). Names are in the page language, or in each language itself.</li><li><a href="#country-choice">Country choice</a> <code>&lt;sav-country-choice&gt;</code>: Choose a country from the complete ISO list (249, already there): flag on the left, ISO 3166 code on the right (alpha-3 by default), search by name or code, one or many. Names follow the page language.</li><li><a href="#theme-choice">Theme choice</a> <code>&lt;sav-theme-choice&gt;</code>: Light, Dark or Auto (follows the system), each with its icon: a menu or buttons. no-auto leaves only Light and Dark. With apply it switches the page by itself.</li><li><a href="#dropzone">Drop zone</a> <code>&lt;sav-dropzone&gt;</code>: An area that accepts things dragged from outside the page: files (upload), or text, links and HTML from other pages and apps — also pasted with Cmd/Ctrl+V. Accepted types, maximum size, one or many, a list of what was dropped. It belongs to forms.</li><li><a href="#range">Range</a> <code>&lt;sav-range&gt;</code>: A slider for numbers within a range.</li><li><a href="#range-dual">Double range</a> <code>&lt;sav-range-dual&gt;</code>: A slider with two handles for a span: a start and an end, such as a price band, an age group or a period between two dates. Each handle works with the keyboard like a normal slider.</li><li><a href="#rating">Rating</a> <code>&lt;sav-rating&gt;</code>: Stars (or any icon) for ratings. Keyboard: arrows, Home, End.</li></ul>
      <h2>Layout</h2>
      <ul><li><a href="#card">Card</a> <code>&lt;sav-card&gt;</code>: A surface for grouped content, with optional media, header and footer.</li><li><a href="#avatar">Avatar</a> <code>&lt;sav-avatar&gt;</code>: A picture, initials or an icon for a person.</li><li><a href="#divider">Divider</a> <code>&lt;sav-divider&gt;</code>: Separates content, horizontally or vertically, with an optional label.</li><li><a href="#container">Container</a> <code>&lt;sav-container&gt;</code>: A centred column with a maximum width and side padding: the frame of a page or of a section. It can also be a surface with a background.</li><li><a href="#grid">Grid</a> <code>&lt;sav-grid&gt;</code>: Puts its children in columns: a fixed number, or as many as fit with a minimum width. On phones fixed columns fall back to one (mobile-columns sets another number).</li><li><a href="#sortable">Sortable (drag and drop)</a> <code>&lt;sav-sortable&gt;</code>: Reorder things by dragging them (mouse, touch, pen) — or with the keyboard: Space picks up, arrows move, Space drops, Escape cancels. Any element can be an item.</li><li><a href="#icon">Icon</a> <code>&lt;sav-icon&gt;</code>: More than 2,000 stroked icons that follow the colour and size of the text. About a hundred are built into the library; the others load by themselves the first time they are used. Search them below and click one to copy it. Most icons come from Lucide (ISC licence).</li><li><a href="#code">Code</a> <code>&lt;sav-code-block · sav-code&gt;</code>: Code with syntax highlighting: a block with its language, optional file name, copy button and line numbers (they are never copied), or a short piece inside a sentence.</li></ul>
      <h2>Content</h2>
      <ul><li><a href="#heading">Heading</a> <code>&lt;sav-heading&gt;</code>: A real h1–h6 with the look of the style: an optional marker before it (a leaning tile in Tilt), a label above and a subtitle below.</li><li><a href="#stat">Stat card</a> <code>&lt;sav-stat&gt;</code>: A number that matters, for dashboards: its name, the value, how it changed — green when it goes the good way, red when not (invert for numbers that should go down) — a caption and a small trend line.</li><li><a href="#timeline">Timeline</a> <code>&lt;sav-timeline · sav-timeline-item&gt;</code>: Things that happened, in order: an order on its way, the history of a document, the steps of a project. Each item has a time, a heading and any content, on a line with a dot or an icon — coloured with a variant; the dots take the shape of the style.</li><li><a href="#kbd">Keyboard key</a> <code>&lt;sav-kbd&gt;</code>: Keys to press, drawn as keycaps that follow the style: mod+K shows ⌘ K on a Mac and Ctrl K elsewhere; several shortcuts with commas, or “then” for one after the other. Screen readers hear “Control + K”.</li><li><a href="#relative-time">Relative time</a> <code>&lt;sav-relative-time&gt;</code>: A moment written the way people say it — “3 minutes ago”, “yesterday”, “in 2 weeks” — in the page language, and kept up to date while the page is open; the full date shows on hover. Or the date itself with format.</li><li><a href="#label">Label</a> <code>&lt;sav-label&gt;</code>: A short caption that names a section or a category — the small &quot;eyebrow&quot; above a title. Unlike a tag it is not removable and does not filter; unlike a badge it is not a status or a count.</li><li><a href="#image">Image</a> <code>&lt;sav-image&gt;</code>: An image with a fixed ratio, the corners of the style (with the tinted plate behind it in Tilt), lazy loading, a caption and an optional zoom.</li><li><a href="#flag">Flag</a> <code>&lt;sav-flag&gt;</code>: The flag of a country (ISO alpha-2) or of a region (gb-sct, es-ct…), from a set of 270 SVG flags that is versioned on its own like the icons. Decorative unless it has a label.</li><li><a href="#list">List</a> <code>&lt;sav-list · sav-list-item&gt;</code>: Rows with something at the start (icon, avatar), a title and description, and something at the end. A row with href is a link, with button a button.</li><li><a href="#table">Table</a> <code>&lt;sav-table&gt;</code>: Styles the normal table you put inside: borders, stripes and hover from the style, a scroll area on small screens, and sorting by clicking a header.</li></ul>
      <h2>Media</h2>
      <ul><li><a href="#carousel">Carousel</a> <code>&lt;sav-carousel · sav-slide&gt;</code>: Slides that scroll sideways — only images, or image and text. Arrow buttons, dots, swipe with fingers, drag with the mouse, arrow keys (each can be turned off), more than one slide at a time, loop and an autoplay that stops on hover, on focus and with reduced motion.</li><li><a href="#video">Video</a> <code>&lt;sav-video&gt;</code>: A video in a frame with the corners of the style, a fixed ratio and a poster with a big play button, then its own control bar: play, the progress bar and the time, mute and volume, full screen — and on request back and forward 10 seconds, speed, loop, captions and picture in picture. The bar hides while playing; keys: Space, arrows, M, F, C. When the player is small, the controls that do not fit move into a ⋯ menu; controls chooses which ones show, native-controls uses the browser’s bar.</li><li><a href="#audio">Audio</a> <code>&lt;sav-audio&gt;</code>: A player in the style with the controls of the video player: play/pause, the progress bar and the time, mute and volume — and on request back and forward 10 seconds, speed and loop; title, artist and cover. Keys: Space or K play, ← → 5 seconds, ↑ ↓ volume, M mute. When the player is small, the controls that do not fit move into a ⋯ menu (and in a very small one the cover steps aside); controls chooses which ones show, native-controls uses the browser’s own player.</li></ul>
      <h2>Overlays</h2>
      <ul><li><a href="#dialog">Dialog</a> <code>&lt;sav-dialog&gt;</code>: A modal window built on the native &lt;dialog&gt;: focus trap, Esc and click outside to close. With sheet-on-mobile it becomes an action sheet on phones (the first demo has it: try it at phone width).</li><li><a href="#drawer">Drawer</a> <code>&lt;sav-drawer&gt;</code>: A panel that slides in from an edge. Same API as the dialog.</li><li><a href="#dropdown">Dropdown</a> <code>&lt;sav-dropdown · sav-menu-item&gt;</code>: A menu that opens from a trigger. Arrow keys, type-ahead, Esc; closes when clicking outside.</li><li><a href="#context-menu">Context menu</a> <code>&lt;sav-context-menu · sav-menu-item&gt;</code>: Your own menu for the right click on an area of the page, instead of the browser’s. It also opens with a long press on phones and tablets, and with the menu key or Shift F10 on the focused area. It opens at the pointer and turns to another corner near the edges of the window; items can hold submenus that fly out to the side. Same items as the dropdown; in text fields the browser’s menu stays, for copy and paste. Opened with the pointer it leaves the focus where it was, so a text field keeps its caret.</li><li><a href="#info-tip">Info tip</a> <code>&lt;sav-info-tip&gt;</code>: A small button (an icon, or an icon with text) that opens a box of information when pressed: for help next to a field, a title or a setting. Unlike the tooltip it opens on click, so it works on phones and can hold links.</li><li><a href="#tooltip">Tooltip</a> <code>&lt;sav-tooltip&gt;</code>: A short hint on hover or focus. It flips when there is no room.</li><li><a href="#popover">Popover</a> <code>&lt;sav-popover&gt;</code>: A panel next to a button with anything inside — text, a small form, a list. A click on the trigger opens it, Esc or a click outside closes it, and the focus goes into the panel and back. Bigger than a tooltip or an info tip, lighter than a dialog; it leans in Tilt and turns to glass in Glass.</li><li><a href="#command">Command palette</a> <code>&lt;sav-command&gt;</code>: A search box over the page with everything you can do or open: type a few letters, move with the arrows, Enter. It opens with a shortcut from anywhere (⌘K on a Mac, Ctrl+K elsewhere), groups commands, shows their icons and shortcuts and highlights what matches.</li></ul>
      <h2>Navigation</h2>
      <ul><li><a href="#tabs">Tabs</a> <code>&lt;sav-tabs · sav-tab&gt;</code>: Switch between panels. Each sav-tab is both the button label and its panel.</li><li><a href="#accordion">Accordion</a> <code>&lt;sav-accordion · sav-details&gt;</code>: Expandable sections with a smooth height animation. exclusive keeps only one open.</li><li><a href="#menu">Menu</a> <code>&lt;sav-menu · sav-menu-item&gt;</code>: A menu that stays on the page, in several kinds: a list (a sidebar, a settings page), a bar across the top whose submenus drop down, and a rail of icons whose labels become tooltips and whose submenus fly out to the side — collapsible folds a list into a rail and back. Any item can hold a submenu; the current item is highlighted the way the style says. Same items as the dropdown, with arrow keys.</li><li><a href="#header">Header</a> <code>&lt;sav-header&gt;</code>: The top bar of a site or app: logo, links, search and actions (an avatar, buttons). When the header is too narrow for everything — its own width, so it works in any layout — the links fold behind a menu button and the search folds into a button that opens the field across the whole header, with an X to close it. The current link is highlighted like the breadcrumb: a tint, a leaning tile, an underline, an inked block or glass, by style.</li><li><a href="#bottom-nav">Bottom navigation</a> <code>&lt;sav-bottom-nav · sav-bottom-nav-item&gt;</code>: The bar at the bottom of a phone app: 3–5 destinations with icon and label, a badge, the current one marked. With fixed it sticks to the bottom; with mobile-only it hides on wide screens.</li><li><a href="#breadcrumb">Breadcrumb</a> <code>&lt;sav-breadcrumb&gt;</code>: Shows where the page sits in the site. The current page (the last item) is highlighted the way the style says: a tint in Soft, a leaning tile in Tilt, an underline in Sharp, an inked block in Brutal, glass in Glass. Long paths can fold the middle behind “…”.</li><li><a href="#pagination">Pagination</a> <code>&lt;sav-pagination&gt;</code>: Page numbers for long lists and tables: always the first and the last, the pages around the current one and “…” in between, previous and next. The current page is highlighted like the breadcrumb, by style. Links (href=&quot;?page={page}&quot;) or buttons that fire sav-page.</li><li><a href="#steps">Steps</a> <code>&lt;sav-steps · sav-step&gt;</code>: The steps of a task — sign-up, checkout, a set-up: the done ones with a tick and a coloured line, the current one marked, the next ones waiting. Across or down; with clickable people go back to a step already done. The markers take the shape and lean of the style.</li><li><a href="#level-path">Level path</a> <code>&lt;sav-level-path · sav-level&gt;</code>: The map of a course, as in learning apps and games: levels on a winding line. The ones done are coloured, with a tick or their icon and their stars; the current one breathes and says what to do (Start); the next ones are locked. The nodes take the shape of the style: round, square, a leaning tile in Tilt. A heading, a divider or a card inside starts a new stretch, across the whole width.</li><li><a href="#tree">Tree</a> <code>&lt;sav-tree · sav-tree-item&gt;</code>: Items inside items that open and close — folders and files, sections and pages. The arrow keys move, → opens or goes in, ← closes or goes to the parent, Enter chooses. The chosen item is highlighted like the current page of the breadcrumb.</li><li><a href="#infinite-scroll">Infinite scroll</a> <code>&lt;sav-infinite-scroll&gt;</code>: Loads more as you reach the end of a list. When the end comes near it fires sav-load; you add the items and call done() — or done(false) when there is nothing more, or fail() on an error. Meanwhile a spinner (the style’s own), at the end a line, on an error “Try again”. It watches the page, or itself when it scrolls; mode=&quot;button&quot; waits for a “Load more” button instead.</li></ul>
      <h2>Charts</h2>
      <ul><li><a href="#chart-bar">Bar chart</a> <code>&lt;sav-chart-bar&gt;</code>: Bars, vertical or horizontal, one series or several side by side, or stacked; spacing, values on the bars, a hover tooltip and a hidden table for screen readers. Colours come from --sav-chart-1…8.</li><li><a href="#chart-pie">Pie chart</a> <code>&lt;sav-chart-pie&gt;</code>: A pie or a donut: gaps between slices, percentages, a text in the centre of the donut.</li><li><a href="#chart-radar">Radar chart</a> <code>&lt;sav-chart-radar&gt;</code>: A spider web: one axis per label, one shape per series — to compare profiles on several qualities at once.</li><li><a href="#chart-line">Area and line chart</a> <code>&lt;sav-chart-line&gt;</code>: Values over time as a filled area or a line only: smooth curves, points, stacked areas.</li><li><a href="#chart-activity">Activity chart</a> <code>&lt;sav-chart-activity&gt;</code>: A calendar heatmap: one column per week, a square per day, darker when the value (1–100) is higher. Good for streaks, contributions, workouts.</li><li><a href="#chart-map">Map chart</a> <code>&lt;sav-chart-map&gt;</code>: The world coloured by value (a choropleth), or with some countries highlighted; it can zoom on one or more countries. Countries are named in the page language; a click tells which one.</li></ul>
      <h2>Sections</h2>
      <ul><li><a href="#showcase">Showcase</a> <code>&lt;sav-showcase&gt;</code>: A section for a product page: screenshots on one side — one or two desktops, one to three phones, or a desktop with phones — and label, title, text and buttons on the other. The buttons here are only examples: on your page they link where you want.</li></ul>
